<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
</head>

<body>
    <h1 style="text-align: center; font-family: Arial; margin-top: 10px; margin-bottom: 5px;">Contact</h1>
    <table border="1" align="center" cellpadding="5">
        <tr>
            <th colspan="2">Send a Message</th>
        </tr>
        <tr>
            <td>Name :</td>
            <td><input type="text"></td>
        </tr>
        <tr>
            <td>Email :</td>
            <td><input type="email"></td>
        </tr>
        <tr>
            <td>Phone :</td>
            <td><input type="tel"></td>
        </tr>
        <tr>
            <td>Subject :</td>
            <td><input type="text"></td>
        </tr>
        <tr>
            <td>Message :</td>
            <td><textarea rows="4" cols="25"></textarea></td>
        </tr>
        <tr>
            <td colspan="2" align="center">
                <input type="submit" value="Send Message">
            </td>
        </tr>

    </table>
</body>

</html>
