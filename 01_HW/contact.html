<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="contact.css">
</head>

<body>
    <nav style="background:#eee;padding:10px;text-align:center;">
        <a href="contact.html">Contact</a> |
        <a href="playlist.html">Playlist</a> |
        <a href="audioList.html">Audio List</a> |
        <a href="tags.html">Tags</a> |
        <a href="summary.html">Summary</a>
    </nav>
    <hr>

    <h1 style="text-align: center; font-family: Arial; margin-top: 10px; margin-bottom: 5px;">Contact</h1>
    <table border="1" align="center" cellpadding="5">
        <tr>
            <th colspan="2">Send a Message</th>
        </tr>
        <tr>
            <td>Name :</td>
            <td><input type="text"></td>
        </tr>
        <tr>
            <td>Email :</td>
            <td><input type="email"></td>
        </tr>
        <tr>
            <td>Phone :</td>
            <td><input type="tel"></td>
        </tr>
        <tr>
            <td>Subject :</td>
            <td><input type="text"></td>
        </tr>
        <tr>
            <td>Message :</td>
            <td><textarea rows="4" cols="25"></textarea></td>
        </tr>
        <tr>
            <td colspan="2" align="center">
                <button id="sendBtn" type="button">Send Message</button>
            </td>
        </tr>

    </table>
    <script>
        function onSendClick() {
            alert("test , message is not sent");
            console.debug("send button clicked");
        }
        document.getElementById("sendBtn").addEventListener("click", onSendClick);
    </script>
</body>

</html>
