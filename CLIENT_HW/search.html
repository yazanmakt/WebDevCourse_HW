<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Search</title>
</head>

<body>

    <header>
        <h1>Welcome</h1>
        <img id="userImage" alt="User image" />
        <span id="welcomeText"></span>
    </header>

    <hr />

    <main>
        <h1>Search</h1>

        <a href="playlists.html">Go to my playlists</a>

        <form id="searchForm">
            <label>
                Search:
                <input type="text" id="query" required />
            </label>

            <label>
                Max results:
                <input type="number" id="maxResults" min="1" max="50" value="10" required />
            </label>

            <button type="submit">Search</button>
        </form>

        <div id="status"></div>
        <div id="results"></div>
    </main>

    <script>
        // ========= AUTH =========
        async function requireLogin() {
            const res = await fetch("/api/me");
            const data = await res.json();
            if (!data.loggedIn) {
                window.location.href = "login.html";
                return null;
            }
            return data.user;
        }

        // ========= YOUTUBE =========
        const YOUTUBE_API_KEY = "AIzaSyADMUDwbzf4YePYVEQ6HzpTDU2iAucIjIY";

        const form = document.getElementById("searchForm");
        const queryInput = document.getElementById("query");
        const maxInput = document.getElementById("maxResults");
        const statusEl = document.getElementById("status");
        const resultsEl = document.getElementById("results");

        function setStatus(t) { statusEl.textContent = t; }

        function writeParamsToUrl(q, max) {
            const url = new URL(window.location.href);
            url.searchParams.set("q", q);
            url.searchParams.set("max", String(max));
            history.replaceState({}, "", url);
        }

        function readParamsFromUrl() {
            const url = new URL(window.location.href);
            const q = url.searchParams.get("q") || "";
            const max = parseInt(url.searchParams.get("max") || "10", 10);
            return { q, max: Number.isFinite(max) ? max : 10 };
        }

        function decodeHtmlEntities(str) {
            const txt = document.createElement("textarea");
            txt.innerHTML = str;
            return txt.value;
        }

        function escapeHtml(str) {
            return String(str)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#39;");
        }

        function formatViews(v) {
            const n = Number(v);
            if (!Number.isFinite(n)) return "";
            return n.toLocaleString();
        }

        function formatDuration(iso) {
            if (!iso) return "";
            const m = iso.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
            if (!m) return "";
            const h = Number(m[1] || 0);
            const min = Number(m[2] || 0);
            const s = Number(m[3] || 0);
            const mm = h > 0 ? String(min).padStart(2, "0") : String(min);
            const ss = String(s).padStart(2, "0");
            return h > 0 ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
        }

        function shortenWithTooltip(text, maxLen = 70) {
            if (!text) return "";
            if (text.length <= maxLen) return escapeHtml(text);
            const short = text.slice(0, maxLen - 3) + "...";
            return `<span title="${escapeHtml(text)}">${escapeHtml(short)}</span>`;
        }

        // ========= PLAYLIST API (SERVER) =========
        async function getPlaylists() {
            const res = await fetch("/api/playlists");
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.error || `Failed to load playlists (${res.status})`);
            return data.playlists || [];
        }

        async function createPlaylist(name) {
            const res = await fetch("/api/playlists", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name })
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.error || `Failed to create playlist (${res.status})`);
            return data.playlist;
        }

        async function addToPlaylist(playlistId, video) {
            const res = await fetch(`/api/playlists/${encodeURIComponent(playlistId)}/items`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(video)
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.error || `Failed to add video (${res.status})`);
            return true;
        }

        async function handleAdd(video) {
            const lists = await getPlaylists();

            let listText = lists.map((p, i) => `${i + 1}) ${p.name}`).join("\n");
            if (!listText) listText = "(no playlists yet)";

            const choice = prompt(
                `Add to playlist:\n\nExisting playlists:\n${listText}\n\n` +
                `Type a number OR type NEW to create a new playlist:`
            );
            if (!choice) return;

            let target = null;

            if (choice.trim().toUpperCase() === "NEW") {
                const name = prompt("New playlist name:");
                if (!name) return;
                target = await createPlaylist(name.trim());
            } else {
                const idx = Number(choice);
                if (!Number.isFinite(idx) || idx < 1 || idx > lists.length) {
                    alert("Invalid choice.");
                    return;
                }
                target = lists[idx - 1];
            }

            await addToPlaylist(target.id, video);
            alert(`Added to playlist: ${target.name}`);
        }

        // ========= SEARCH =========
        async function doSearch(q, max) {
            setStatus("Searching...");
            resultsEl.innerHTML = "";

            const searchUrl =
                `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video` +
                `&q=${encodeURIComponent(q)}&maxResults=${max}&key=${YOUTUBE_API_KEY}`;

            const searchRes = await fetch(searchUrl);
            const searchData = await searchRes.json();

            if (!searchRes.ok) {
                resultsEl.innerHTML = `<pre style="border:1px solid red;padding:10px;">${escapeHtml(JSON.stringify(searchData, null, 2))}</pre>`;
                setStatus("Error.");
                return;
            }

            const items = searchData.items || [];
            const videoIds = items.map(it => it.id?.videoId).filter(Boolean);

            if (!videoIds.length) {
                resultsEl.textContent = "No results found.";
                setStatus("Done.");
                return;
            }

            const videosUrl =
                `https://www.googleapis.com/youtube/v3/videos?part=contentDetails,statistics` +
                `&id=${encodeURIComponent(videoIds.join(","))}&key=${YOUTUBE_API_KEY}`;

            const videosRes = await fetch(videosUrl);
            const videosData = await videosRes.json();

            const byId = {};
            for (const v of (videosData.items || [])) byId[v.id] = v;

            const merged = items.map(it => {
                const id = it.id?.videoId;
                const v = byId[id] || {};
                return {
                    videoId: id,
                    title: decodeHtmlEntities(it.snippet?.title || ""),
                    channel: it.snippet?.channelTitle || "",
                    thumb: it.snippet?.thumbnails?.medium?.url || it.snippet?.thumbnails?.default?.url || "",
                    durationISO: v.contentDetails?.duration || "",
                    views: v.statistics?.viewCount || ""
                };
            });

            renderResultsTable(merged);
            setStatus("Done.");
        }

        function renderResultsTable(videos) {
            resultsEl.innerHTML = "";

            const table = document.createElement("table");
            table.border = "1";
            table.cellPadding = "8";
            table.style.borderCollapse = "collapse";
            table.style.width = "100%";

            table.innerHTML = `
      <thead>
        <tr>
          <th>Thumbnail</th>
          <th>Duration</th>
          <th>Views</th>
          <th>Channel</th>
          <th>Favorites</th>
        </tr>
      </thead>
      <tbody></tbody>
    `;

            const tbody = table.querySelector("tbody");

            for (const v of videos) {
                const tr1 = document.createElement("tr");
                tr1.innerHTML = `
        <td rowspan="2">
          <a target="_blank" href="https://www.youtube.com/watch?v=${encodeURIComponent(v.videoId)}">
            <img src="${escapeHtml(v.thumb)}" width="160" alt="thumb">
          </a>
        </td>
        <td>${escapeHtml(formatDuration(v.durationISO))}</td>
        <td>${escapeHtml(formatViews(v.views))}</td>
        <td>${escapeHtml(v.channel)}</td>
        <td><button class="addBtn">Add</button></td>
      `;

                const tr2 = document.createElement("tr");
                tr2.innerHTML = `
        <td colspan="4">
          <a target="_blank" href="https://www.youtube.com/watch?v=${encodeURIComponent(v.videoId)}"
             style="text-decoration:none;color:inherit;">
            ${shortenWithTooltip(v.title, 70)}
          </a>
        </td>
      `;

                tbody.appendChild(tr1);
                tbody.appendChild(tr2);

                tr1.querySelector(".addBtn").addEventListener("click", async () => {
                    try {
                        await handleAdd(v);
                    } catch (e) {
                        console.error(e);
                        alert("Add failed: " + (e?.message || e));
                    }
                });
            }

            resultsEl.appendChild(table);
        }

        // ========= RUN =========
        (async () => {
            const user = await requireLogin();
            if (!user) return;

            document.getElementById("welcomeText").textContent = `${user.firstName} ${user.lastName}`;
            const img = document.getElementById("userImage");
            img.src = user.imageUrl;
            img.width = 50;
            img.height = 50;

            const params = readParamsFromUrl();
            if (params.q) {
                queryInput.value = params.q;
                maxInput.value = String(params.max);
                doSearch(params.q, params.max);
            }
        })();

        form.addEventListener("submit", (e) => {
            e.preventDefault();
            const q = queryInput.value.trim();
            const max = parseInt(maxInput.value, 10);
            if (!q) return setStatus("Please enter a search term");
            writeParamsToUrl(q, max);
            doSearch(q, max);
        });
    </script>


</body>

</html>
