<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Playlists</title>
</head>

<body>

    <header>
        <h1>My Playlists</h1>
        <a href="search.html">Back to search</a>
    </header>

    <hr />

    <div style="display:flex; gap:20px;">
        <!-- Sidebar -->
        <aside style="min-width:260px; border-right:1px solid #ccc; padding-right:12px;">
            <h3>My playlists</h3>
            <button id="newPlBtn">+ New Playlist</button>
            <div id="plList" style="margin-top:10px;"></div>
        </aside>

        <!-- Main content -->
        <main style="flex:1;">
            <h2 id="plTitle">Choose a playlist...</h2>
            <div id="plItems"></div>
        </main>
    </div>

    <script>
        async function requireLogin() {
            const res = await fetch("/api/me");
            const data = await res.json();
            if (!data.loggedIn) {
                window.location.href = "login.html";
                return null;
            }
            return data.user;
        }

        function getQueryParam(key) {
            return new URL(window.location.href).searchParams.get(key) || "";
        }

        function setQueryParam(key, value) {
            const url = new URL(window.location.href);
            if (value) url.searchParams.set(key, value);
            else url.searchParams.delete(key);
            history.replaceState({}, "", url.toString());
        }

        async function getMyPlaylists() {
            const res = await fetch("/api/playlists");
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || "Failed to load playlists");
            return data.playlists || [];
        }

        async function createPlaylist(name) {
            const res = await fetch("/api/playlists", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || "Failed to create playlist");
            return data.playlist;
        }

        async function deleteItem(playlistId, videoId) {
            const res = await fetch(`/api/playlists/${encodeURIComponent(playlistId)}/items/${encodeURIComponent(videoId)}`, {
                method: "DELETE"
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || "Failed to delete");
            return true;
        }

        function escapeHtml(str) {
            return String(str)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#39;");
        }

        function renderSidebar(playlists) {
            const box = document.getElementById("plList");
            box.innerHTML = "";

            if (!playlists.length) {
                box.textContent = "No playlists yet.";
                return;
            }

            const ul = document.createElement("ul");
            for (const p of playlists) {
                const li = document.createElement("li");
                li.style.marginBottom = "6px";
                li.innerHTML = `<a href="playlists.html?playlistId=${encodeURIComponent(p.id)}">${escapeHtml(p.name)}</a>`;
                ul.appendChild(li);
            }
            box.appendChild(ul);
        }

        function renderPlaylist(playlist) {
            const title = document.getElementById("plTitle");
            const itemsBox = document.getElementById("plItems");

            if (!playlist) {
                title.textContent = "Choose a playlist...";
                itemsBox.innerHTML = "";
                return;
            }

            title.textContent = playlist.name;

            if (!playlist.items || playlist.items.length === 0) {
                itemsBox.innerHTML = "<p>No items in this playlist.</p>";
                return;
            }

            const table = document.createElement("table");
            table.border = "1";
            table.cellPadding = "8";
            table.style.borderCollapse = "collapse";
            table.style.width = "100%";

            table.innerHTML = `
      <thead>
        <tr>
          <th>Thumb</th>
          <th>Title</th>
          <th>Channel</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    `;

            const tbody = table.querySelector("tbody");

            for (const it of playlist.items) {
                const tr = document.createElement("tr");
                tr.innerHTML = `
        <td><img src="${escapeHtml(it.thumb || "")}" width="120" alt="thumb"></td>
        <td>
          <a target="_blank" href="https://www.youtube.com/watch?v=${encodeURIComponent(it.videoId)}">
            ${escapeHtml(it.title || it.videoId)}
          </a>
        </td>
        <td>${escapeHtml(it.channel || "")}</td>
        <td><button class="delBtn">Delete</button></td>
      `;

                tr.querySelector(".delBtn").addEventListener("click", async () => {
                    if (!confirm("Delete this item?")) return;
                    try {
                        await deleteItem(playlist.id, it.videoId);
                        location.reload(); // simplest for homework
                    } catch (e) {
                        alert(e.message);
                    }
                });

                tbody.appendChild(tr);
            }

            itemsBox.innerHTML = "";
            itemsBox.appendChild(table);
        }

        (async () => {
            await requireLogin();

            const playlists = await getMyPlaylists();
            renderSidebar(playlists);

            const playlistId = getQueryParam("playlistId");
            const selected = playlists.find(p => p.id === playlistId) || null;
            renderPlaylist(selected);

            document.getElementById("newPlBtn").addEventListener("click", async () => {
                const name = prompt("New playlist name:");
                if (!name) return;
                try {
                    const p = await createPlaylist(name.trim());
                    setQueryParam("playlistId", p.id);
                    location.reload();
                } catch (e) {
                    alert(e.message);
                }
            });
        })();
    </script>

</body>

</html>
